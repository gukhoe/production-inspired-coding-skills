name: Tool and skill quality
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install auditor and review tools
        run: python -m pip install ".[mcp]" ruff==0.17.4 bandit==1.9.4 radon==6.0.1
      - name: Unit and actual stdio MCP integration
        run: python -m unittest discover -s tests -v
      - name: Complete network partition invariants
        run: node tests/test_network_partitions.mjs
      - name: Evidence-check mutation sentinels
        run: python scripts/check_audit_mutations.py
      - name: Portable skill forms and drift
        run: python scripts/build_skills.py --check
      - name: Immutable research provenance (local outputs only)
        run: python -X utf8 scripts/recheck_evidence.py --out .process-audit/ci-evidence
      - name: Python correctness lint
        run: python -m ruff check skills/software-process-audit/scripts tests scripts/build_skills.py scripts/skill_catalog.py scripts/evaluate_reviewers.py scripts/check_audit_mutations.py --select E9,F63,F7,F82,F401
      - name: Auditor security checks
        run: python -m bandit -r skills/software-process-audit/scripts -q
      - name: Complexity visibility
        run: python -m radon cc skills/software-process-audit/scripts -s -a
      - name: Independent operation without site packages
        run: python -S examples/connection-audit/run_demo.py --out .process-audit/ci-demo
      # No project audit files, private graphs or generated reports are uploaded.
